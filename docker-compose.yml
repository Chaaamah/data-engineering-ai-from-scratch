services:
  postgres:
    # PostgreSQL 16 plus the pgvector extension used in Chapter 11.
    # Everything from Chapters 2-10 works exactly as with the plain postgres:16 image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_password
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper) for Chapter 9.
    # Start it with: docker compose --profile streaming up -d
    image: apache/kafka:4.0.0
    profiles: ["streaming"]
    ports:
      - "9092:9092"

volumes:
  pgdata:
